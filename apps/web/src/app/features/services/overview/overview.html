<fo-page-header
  title="Services"
  subtitle="Organization service catalog used by deployments and health probes."
/>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<div class="table-wrap fo-panel">
  <table class="dense">
    <thead>
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Active</th>
        <th>Repository</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      @if (loading()) {
        <tr><td colspan="5" class="empty">Loading services…</td></tr>
      } @else {
        @for (row of rows(); track row.id) {
          <tr>
            <td>{{ row.name }}</td>
            <td class="mono">{{ row.slug }}</td>
            <td>
              <fo-status-badge
                [label]="row.isActive ? 'active' : 'inactive'"
                [tone]="row.isActive ? 'success' : 'neutral'"
                [dot]="false"
              />
            </td>
            <td class="mono muted">{{ row.repositoryUrl || '—' }}</td>
            <td class="muted">{{ row.description || '—' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="5" class="empty">No services in this organization.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
