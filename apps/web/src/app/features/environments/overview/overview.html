<fo-page-header
  title="Environments"
  subtitle="Dev / QA / UAT / Prod. Prod requires approval before deploy continues."
/>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<div class="table-wrap fo-panel">
  <table class="dense">
    <thead>
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Approval gate</th>
        <th>Sort</th>
      </tr>
    </thead>
    <tbody>
      @if (loading()) {
        <tr><td colspan="4" class="empty">Loading environments…</td></tr>
      } @else {
        @for (row of rows(); track row.id) {
          <tr>
            <td>{{ row.name }}</td>
            <td class="mono">{{ row.slug }}</td>
            <td>
              <fo-status-badge
                [label]="row.requiresApproval ? 'required' : 'auto'"
                [tone]="row.requiresApproval ? 'warning' : 'success'"
                [dot]="false"
              />
            </td>
            <td class="mono">{{ row.sortOrder ?? '—' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="empty">No environments configured.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
